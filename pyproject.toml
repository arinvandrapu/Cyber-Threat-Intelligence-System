[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cti"
version = "0.1.0"
description = "Cyber threat intelligence pipeline: ingest, enrich, prioritize, and present."
readme = "README.md"
requires-python = ">=3.12.4"  # 3.12.4 fixes ipaddress is_global/is_private (CVE-2024-4032)
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "boto3>=1.36,<2",  # S3 conditional writes (IfNoneMatch)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "respx>=0.22",
    "moto[s3]>=5.0",
    "ruff>=0.8",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S108"]
