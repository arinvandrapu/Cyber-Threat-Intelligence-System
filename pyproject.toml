[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cti"
version = "0.1.0"
description = "Cyber threat intelligence pipeline: ingest, enrich, prioritize, and present."
readme = "README.md"
requires-python = ">=3.12.4"  # 3.12.4 fixes ipaddress is_global/is_private (CVE-2024-4032)
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "boto3>=1.36,<2",  # S3 conditional writes (IfNoneMatch)
    "ijson>=3.3,<4",  # streaming JSON: NVD yearly feeds are ~300 MB uncompressed
    "defusedxml>=0.7,<1",  # safe XML parsing (no XXE / entity expansion)
    "protego>=0.3,<1",  # RFC 9309 robots.txt (wildcards, longest match)
    "tldextract>=5.3,<6",  # public-suffix check for extracted domains (bundled list, offline)
]

[project.scripts]
cti = "cti.cli:main"

[project.optional-dependencies]
# Reference-page cleaning (cti enrich --only references)
enrich = [
    "trafilatura>=2.3.1,<3",
    "lxml>=6.1.3",
]
# ATT&CK grading and baselines (cti attack-eval)
ml = [
    "numpy>=2.1",
    "scikit-learn>=1.6",
]
# SecureBERT 2.0 (cti models / ner / ner-eval / embed / attack-eval --methods biencoder).
# Heavy (torch), so CI does not install it; its lock is audited instead.
nlp = [
    "torch>=2.9,<3",
    "transformers>=4.48,<6",  # ModernBERT needs 4.48; v6 may change tokenizers/pipelines
    "safetensors>=0.4",
    "huggingface-hub>=0.26",
]
dev = [
    "pytest>=8.3",
    "respx>=0.22",
    "moto[s3]>=5.0",
    "ruff>=0.8",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S108", "S603", "S607"]
