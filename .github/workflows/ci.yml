name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR cancels the older run; runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements.lock -e '.[dev,enrich,ml]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest
      - name: Audit dependencies
        run: pip-audit --skip-editable
      - name: Audit the nlp lock (torch, transformers; not installed in CI)
        run: pip-audit -r requirements-nlp.lock --no-deps --disable-pip

  web:
    # the dashboard: locked install, supply-chain checks, typecheck + build against the
    # synthetic fixture, static checks, then every view in headless Chrome under the real CSP
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (lockfile only, no install scripts)
        run: npm ci
      - name: Verify registry signatures and provenance
        run: npm audit signatures
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Typecheck and build
        run: npm run build
      - name: Static checks on the build and source
        run: npm run check
      - name: Browser smoke test (every view, real CSP, synthetic fixture)
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements.lock -e .
          python web/scripts/smoke.py --export-dir web/fixtures

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
